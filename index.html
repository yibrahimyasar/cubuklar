<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EBDD">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Çubuklar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="İki kişilik çubuk yerleştirme oyunu.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<title>Çubuklar</title>
<style>
  :root {
    --paper: #F3EBDD;
    --cell: #FBF7EF;
    --line: #D8C9AE;
    --ink: #1F2A36;
    --muted: #7A6E5C;
    --p0: #D9573B;   /* Oyuncu 1: kiremit */
    --p1: #2A7F7A;   /* Oyuncu 2: çam yeşili */
    --ok: #4F8F4A;
    --bad: #B3403A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--paper);
    color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 18px);
    user-select: none;
    touch-action: manipulation;
  }
  header, .counts, .msg, .hint { width: 100%; max-width: 400px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  h1 {
    font-family: Fraunces, Georgia, serif;
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .turn { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .p0 { background: var(--p0); }
  .p1 { background: var(--p1); }
  .counts { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
  .msg { min-height: 22px; font-size: 15px; text-align: center; }

  .board {
    width: min(92vw, 400px);
    aspect-ratio: 1;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 6px;
    padding: 8px;
    background: var(--line);
    border-radius: 16px;
  }
  .cell {
    background: var(--cell);
    border-radius: 8px;
    cursor: pointer;
  }
  .cell.filled { cursor: default; }
  .cell.filled.p0 { background: var(--p0); }
  .cell.filled.p1 { background: var(--p1); }
  .cell.ghost-ok  { box-shadow: inset 0 0 0 999px rgba(79, 143, 74, 0.38); }
  .cell.ghost-bad { box-shadow: inset 0 0 0 999px rgba(179, 64, 58, 0.38); }

  .tray-title { font-size: 14px; color: var(--muted); }
  .tray {
    min-height: 56px;
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
  }
  .piece {
    display: flex;
    gap: 3px;
    padding: 6px;
    border: 2px solid transparent;
    border-radius: 10px;
    background: transparent;
    cursor: pointer;
  }
  .piece.sel { border-color: var(--ink); background: rgba(255, 255, 255, 0.55); }
  .seg { width: 24px; height: 24px; border-radius: 6px; }

  .controls { display: flex; gap: 10px; }
  .btn {
    font: inherit;
    font-size: 15px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn:focus-visible, .piece:focus-visible, .cell:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }
  .btn.install { border-color: var(--p1); color: var(--p1); }
  .hint { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <h1>Çubuklar</h1>
  <div class="turn" id="turn"></div>
</header>

<div class="counts" id="counts"></div>
<div class="msg" id="msg" role="status" aria-live="polite"></div>

<div class="board" id="board" role="grid" aria-label="Oyun tahtası"></div>

<div class="tray-title" id="trayTitle"></div>
<div class="tray" id="tray"></div>

<div class="controls">
  <button class="btn" id="rot">Döndür (G)</button>
  <button class="btn primary" id="new">Yeni oyun</button>
</div>
<div class="controls">
  <button class="btn install" id="install" hidden>Uygulamayı yükle</button>
</div>

<p class="hint">
  Bir çubuk seç, tahtada bir kareye dokun, aynı kareye tekrar dokunarak yerleştir.
  Bilgisayarda: G döndürür, ok tuşları konumu değiştirir, Enter yerleştirir.
  Bir satır ya da sütunu tamamen doldurursan kazanırsın.
</p>

<script>
  const N = 6;
  const LENGTHS = [2, 2, 2, 3, 3, 3, 4, 4, 4, 5];
  const NAMES = ['Oyuncu 1', 'Oyuncu 2'];
  const COLORS = ['p0', 'p1'];

  const boardEl = document.getElementById('board');
  const trayEl = document.getElementById('tray');
  const trayTitleEl = document.getElementById('trayTitle');
  const turnEl = document.getElementById('turn');
  const countsEl = document.getElementById('counts');
  const msgEl = document.getElementById('msg');
  const rotBtn = document.getElementById('rot');
  const newBtn = document.getElementById('new');

  let S;

  function newGame() {
    S = {
      board: Array.from({ length: N }, () => Array(N).fill(-1)),
      pieces: [0, 1].map(() => LENGTHS.map((len, id) => ({ id, len, used: false }))),
      cur: 0,
      sel: null,     // seçili çubuğun id'si (cur oyuncunun listesinde)
      dir: 'h',      // 'h' yatay, 'v' dikey
      prev: null,    // önizleme konumu {r, c}
      over: false,
      winner: -1,
      msg: 'Oyuncu 1 başlıyor. Bir çubuk seç.'
    };
    render();
  }

  // Çubuğun (r,c) başlangıcından itibaren kapladığı hücreler (tahta dışı olabilir)
  function cellsFor(r, c, dir, len) {
    const out = [];
    for (let k = 0; k < len; k++) {
      out.push(dir === 'h' ? [r, c + k] : [r + k, c]);
    }
    return out;
  }

  // Sığıyorsa hücre listesini, sığmıyorsa null döndürür
  function fits(r, c, dir, len) {
    const cells = cellsFor(r, c, dir, len);
    for (const [rr, cc] of cells) {
      if (rr < 0 || rr >= N || cc < 0 || cc >= N) return null;
      if (S.board[rr][cc] !== -1) return null;
    }
    return cells;
  }

  function anyFit(len) {
    for (let r = 0; r < N; r++)
      for (let c = 0; c < N; c++)
        for (const d of ['h', 'v'])
          if (fits(r, c, d, len)) return true;
    return false;
  }

  function canMove(p) {
    return S.pieces[p].some(pc => !pc.used && anyFit(pc.len));
  }

  function fullLineExists() {
    for (let i = 0; i < N; i++) {
      if (S.board[i].every(v => v !== -1)) return true;
      if (S.board.every(row => row[i] !== -1)) return true;
    }
    return false;
  }

  function place(r, c) {
    const pc = S.pieces[S.cur][S.sel];
    const cells = fits(r, c, S.dir, pc.len);
    if (!cells) {
      S.msg = 'Çubuk buraya sığmıyor.';
      render();
      return;
    }
    cells.forEach(([rr, cc]) => { S.board[rr][cc] = S.cur; });
    pc.used = true;
    S.sel = null;
    S.prev = null;

    if (fullLineExists()) {
      S.over = true;
      S.winner = S.cur;
      S.msg = `${NAMES[S.cur]} bir satır ya da sütunu tamamen kapattı ve kazandı!`;
    } else {
      advance();
    }
    render();
  }

  function advance() {
    const other = 1 - S.cur;
    if (canMove(other)) {
      S.cur = other;
      S.msg = `Sıra ${NAMES[other]}'de.`;
    } else if (canMove(S.cur)) {
      S.msg = `${NAMES[other]} hamle yapamıyor. ${NAMES[S.cur]} devam ediyor.`;
    } else {
      S.over = true;
      S.winner = -1;
      S.msg = 'Kimse hamle yapamıyor. Berabere!';
    }
  }

  function tapCell(r, c) {
    if (S.over) return;
    if (S.sel === null) {
      S.msg = 'Önce tepsiden bir çubuk seç.';
      render();
      return;
    }
    if (S.prev && S.prev.r === r && S.prev.c === c) {
      place(r, c);
      return;
    }
    S.prev = { r, c };
    S.msg = 'Yerleştirmek için aynı kareye tekrar dokun.';
    render();
  }

  function tapPiece(id) {
    if (S.over) return;
    const pc = S.pieces[S.cur][id];
    if (pc.used) return;
    if (S.sel === id) {
      S.sel = null;
      S.prev = null;
      S.msg = 'Çubuk seçimi kaldırıldı.';
    } else {
      S.sel = id;
      S.prev = null;
      S.msg = `${pc.len} kareli çubuk seçildi. Tahtada bir kareye dokun.`;
    }
    render();
  }

  function rotate() {
    S.dir = S.dir === 'h' ? 'v' : 'h';
    render();
  }

  function ghostMap() {
    const map = {};
    if (S.over || S.sel === null || !S.prev) return map;
    const pc = S.pieces[S.cur][S.sel];
    const ok = !!fits(S.prev.r, S.prev.c, S.dir, pc.len);
    for (const [rr, cc] of cellsFor(S.prev.r, S.prev.c, S.dir, pc.len)) {
      if (rr >= 0 && rr < N && cc >= 0 && cc < N) {
        map[rr * N + cc] = ok ? 'ok' : 'bad';
      }
    }
    return map;
  }

  function render() {
    // Tahta
    const gm = ghostMap();
    boardEl.innerHTML = '';
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const el = document.createElement('div');
        el.className = 'cell';
        el.setAttribute('role', 'gridcell');
        const owner = S.board[r][c];
        if (owner >= 0) el.classList.add('filled', COLORS[owner]);
        const g = gm[r * N + c];
        if (g) el.classList.add('ghost-' + g);
        el.addEventListener('click', () => tapCell(r, c));
        boardEl.appendChild(el);
      }
    }

    // Sıra ve sayaçlar
    if (S.over) {
      turnEl.textContent = 'Oyun bitti';
    } else {
      turnEl.innerHTML = `<span class="dot ${COLORS[S.cur]}"></span>${NAMES[S.cur]}`;
    }
    const left = S.pieces.map(ps => ps.filter(p => !p.used).length);
    countsEl.innerHTML = `<span>${NAMES[0]}: ${left[0]} çubuk</span><span>${NAMES[1]}: ${left[1]} çubuk</span>`;
    msgEl.textContent = S.msg;

    // Tepsi (yalnızca sırası olan oyuncunun çubukları)
    trayEl.innerHTML = '';
    if (S.over) {
      trayTitleEl.textContent = '';
    } else {
      trayTitleEl.textContent = `${NAMES[S.cur]} için çubuklar`;
      for (const pc of S.pieces[S.cur]) {
        if (pc.used) continue;
        const btn = document.createElement('button');
        btn.className = 'piece' + (S.sel === pc.id ? ' sel' : '');
        btn.setAttribute('aria-label', `${pc.len} kareli çubuk`);
        for (let i = 0; i < pc.len; i++) {
          const seg = document.createElement('span');
          seg.className = 'seg ' + COLORS[S.cur];
          btn.appendChild(seg);
        }
        btn.addEventListener('click', () => tapPiece(pc.id));
        trayEl.appendChild(btn);
      }
    }

    rotBtn.textContent = `Döndür (G) · ${S.dir === 'h' ? 'Yatay' : 'Dikey'}`;
  }

  // Klavye: G döndürür, ok tuşları konumu taşır, Enter yerleştirir, Esc iptal eder
  document.addEventListener('keydown', e => {
    if (S.over) return;
    const k = e.key.toLowerCase();
    if (k === 'g') {
      rotate();
    } else if (k === 'escape') {
      S.sel = null;
      S.prev = null;
      S.msg = 'Seçim iptal edildi.';
      render();
    } else if (S.sel !== null && ['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) {
      e.preventDefault();
      if (!S.prev) S.prev = { r: 0, c: 0 };
      const len = S.pieces[S.cur][S.sel].len;
      const maxR = S.dir === 'v' ? N - len : N - 1;
      const maxC = S.dir === 'h' ? N - len : N - 1;
      if (k === 'arrowup') S.prev.r = Math.max(0, S.prev.r - 1);
      if (k === 'arrowdown') S.prev.r = Math.min(maxR, S.prev.r + 1);
      if (k === 'arrowleft') S.prev.c = Math.max(0, S.prev.c - 1);
      if (k === 'arrowright') S.prev.c = Math.min(maxC, S.prev.c + 1);
      render();
    } else if (k === 'enter' && S.sel !== null && S.prev) {
      e.preventDefault();
      place(S.prev.r, S.prev.c);
    }
  });

  rotBtn.addEventListener('click', rotate);
  newBtn.addEventListener('click', () => {
    if (!S.over && S.pieces.some(ps => ps.some(p => p.used))) {
      if (!confirm('Mevcut oyun silinsin mi?')) return;
    }
    newGame();
  });

  // Android Chrome yükleme isteği
  const installBtn = document.getElementById('install');
  const isInstalled = () =>
    window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  let deferredPrompt = null;

  if (!isInstalled()) {
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.hidden = false;
    });
  }
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.hidden = true;
  });
  window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    installBtn.hidden = true;
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  newGame();
</script>
</body>
</html>
